<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:;">
  <title>Limite restante do CodePet</title>
  <link rel="stylesheet" href="usage.css">
  <script src="usage-renderer.js" defer></script>
</head>
<body>
  <main id="details">
    <header class="popup-header">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span><strong>Limite restante</strong><small>LIMITES</small></span>
      </div>
      <button id="close" class="icon-button" type="button" aria-label="Fechar">×</button>
    </header>
    <div class="section-title-row">
      <h1>Contas conectadas agora</h1>
      <button id="refresh" class="text-button" type="button">Atualizar</button>
    </div>
    <div id="providers" aria-live="polite"><p class="empty">Conferindo o login…</p></div>
    <footer><span id="status">Atualização automática</span><button id="accounts" class="text-button" type="button">Gerenciar contas</button></footer>
  </main>
</body>
</html>
